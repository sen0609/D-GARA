task_gmaps_search_save_location:
  description: "Verifies that a specific location has been successfully saved on Google Maps."
  conditions:
    # Condition 2: Verify the 'Save' button is in a 'Saved' state by checking its description and checked status.
    - type: element_property
      selector: "content-desc*='is saved to'"
      attribute: "checked"
      value: "true"


task_gmaps_navigate_driving_route:
  description: "Generic rule: Verifies that a driving route has been successfully planned in Google Maps."
  conditions:
    # Condition 1: Verify the Driving mode tab is present, confirming the context.
    - type: element_property_contains
      selector: "class='android.widget.LinearLayout'"
      attribute: "content-desc"
      value: "Driving mode"
      
    # Condition 2: Verify that a destination has been set by checking for the label.
    - type: element_property_contains
      selector: "class='android.widget.TextView'"
      attribute: "content-desc"
      value: "Destination,"

    # Condition 3: Verify the 'Start' button is available, confirming the route is ready.
    - type: element_exists
      selector: "content-desc='Start'"

task_gmaps_search_transit_route:
  description: "Verifies that a public transit route to a specific destination has been planned."
  conditions:
    # Condition 1: Verify the "Transit mode" tab is active.
    - type: element_property_contains
      selector: "class='android.widget.LinearLayout'"
      attribute: "content-desc"
      value: "Transit mode"

    # Condition 2: Verify the destination is correct.
    - type: element_property_contains
      selector: "class='android.widget.TextView'"
      attribute: "content-desc"
      value: "San Francisco"

    # Condition 3: Verify that the list of route options has been loaded.
    - type: element_exists
      selector: "resource-id='com.google.android.apps.maps:id/directions_group_list'"