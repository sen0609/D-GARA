# success_conditions.yaml

task_bili_search_and_like_video:
  description: "Unified validation of Bilibili video like status (compatible with landscape and portrait)"
  conditions:
  # Top-level condition: any_of (satisfy any of the following)
    - type: any_of
      sub_conditions:
        
  # Case A: Like success status for landscape long video
        - type: element_property_contains
          selector: "resource-id='tv.danmaku.bili:id/frame_like'"
          attribute: "content-desc"
          value: "已点赞"
          
  # Case B: Like success status for portrait short video
        - type: element_property
          selector: "resource-id='tv.danmaku.bili:id/like_icon'"
          attribute: "selected"
          value: "true"

task_bili_search_and_collect_video:
  description: "Unified validation of Bilibili video favorite status (compatible with landscape and portrait)"
  conditions:
    - type: any_of
      sub_conditions:
        
  # Case A: Favorite success status for landscape long video
        - type: element_property_contains
          selector: "resource-id='tv.danmaku.bili:id/frame_fav'"
          attribute: "content-desc"
          value: "已收藏"
          
  # Case B: Favorite success status for portrait short video
        - type: element_property
          selector: "resource-id='tv.danmaku.bili:id/favorite_icon'"
          attribute: "selected"
          value: "true"

task_bili_search_and_coin_video:
  description: "Unified validation of Bilibili video coin status (compatible with landscape and portrait), ignoring like side effects"
  conditions:
    - type: any_of
      sub_conditions:
        
  # Case A: Coin success status for landscape long video
        - type: element_property_contains
          selector: "resource-id='tv.danmaku.bili:id/frame_coin'"
          attribute: "content-desc"
          value: "已投币"
          
  # Case B: Coin success status for portrait short video
        - type: element_property
          selector: "resource-id='tv.danmaku.bili:id/coin_icon'"
          attribute: "selected"
          value: "true"

task_bili_switch_to_dynamics_tab:
  description: "Switch to the 'Dynamic' tab at the bottom on the homepage and browse the dynamic list"
  conditions:
  # Condition 1: Verify the 'Dynamic' tab at the bottom is selected
    - type: element_property
      selector: "content-desc='动态,5之2,标签'"
      attribute: "selected"
      value: "true"
      
  # Condition 2: Verify the list view exists on the dynamic page to ensure content is loaded
    - type: element_exists
      selector: "resource-id='tv.danmaku.bili:id/dy_list'"

